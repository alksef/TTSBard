name: CI

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  check-docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, statuses and artifacts
        shell: pwsh
        run: ./scripts/check-docs.ps1

  check-fmt:
    name: Check Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  check-clippy:
    name: Run Clippy linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run clippy
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: cargo clippy --all-targets --all-features -- -D warnings

  check-types:
    name: Check TypeScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check IPC contracts
        run: |
          npm run check:ipc
          npm run test:ipc
      - name: Type check
        run: npm run build

  test-rust:
    name: Run Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare Piper test data
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --package espeak-rs-sys --locked
          espeak_data=""
          while IFS= read -r candidate; do
            if test -d "$candidate/voices" && test -d "$candidate/lang" && test -f "$candidate/en_dict"; then
              espeak_data="$(realpath "$candidate")"
              break
            fi
          done < <(find src-tauri/target/debug/build -path '*/out/share/espeak-ng-data' -type d)
          test -n "$espeak_data"
          test -d "$espeak_data/voices"
          test -d "$espeak_data/lang"
          test -f "$espeak_data/en_dict"
          echo "PIPER_ESPEAKNG_DATA_DIRECTORY=$espeak_data" >> "$GITHUB_ENV"
      - name: Run tests
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: cargo test --verbose

  build-check:
    name: Build check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build check
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: npm run tauri build --debug

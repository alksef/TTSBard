name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  wait-for-ci:
    name: Wait for successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for CI on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '.workflow_runs | map(select(.head_branch == "master" or .head_branch == "main")) | sort_by(.created_at) | last | .id // empty')

            if [[ -z "$run_id" ]]; then
              echo "CI for ${GITHUB_SHA} has not appeared yet; waiting..."
              sleep 15
              continue
            fi

            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.html_url')

            if [[ "$status" != "completed" ]]; then
              echo "CI is ${status}: ${url}"
              sleep 15
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              echo "CI succeeded: ${url}"
              exit 0
            fi

            echo "CI concluded with '${conclusion}': ${url}"
            exit 1
          done

          echo "Timed out waiting for CI for ${GITHUB_SHA}"
          exit 1

  build:
    needs: wait-for-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Strip 'v' prefix from tag (v1.2.3 -> 1.2.3)
            VERSION=${GITHUB_REF_NAME#v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using tag version: $VERSION"
          else
            # Use default dev version for PRs and manual runs
            echo "VERSION=0.3.0-dev" >> $GITHUB_OUTPUT
            echo "Using dev version"
          fi
        shell: bash

      - name: Set version
        run: node scripts/set-version.cjs "${{ steps.get_version.outputs.VERSION }}" "${{ github.sha }}"

      - name: Verify native build tools
        shell: pwsh
        run: |
          cmake --version
          $libclang = @(
            'C:\Program Files\LLVM\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\x64\bin\libclang.dll'
          ) | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $libclang) { throw 'libclang.dll not found for espeak-rs-sys bindgen' }
          "LIBCLANG_PATH=$($libclang.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "Using $($libclang.FullName)"

      - name: Prepare Piper test data
        shell: pwsh
        run: |
          .\scripts\cargo.ps1 build --manifest-path src-tauri/Cargo.toml --package espeak-rs-sys --locked
          $espeakData = Get-ChildItem `
            'src-tauri\target\debug\build\espeak-rs-sys-*\out\share\espeak-ng-data' `
            -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $espeakData) { throw 'compiled espeak-ng-data not found' }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'voices') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing voices/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'lang') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing lang/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'en_dict') -PathType Leaf)) {
            throw 'compiled espeak-ng-data is missing en_dict'
          }
          "PIPER_ESPEAKNG_DATA_DIRECTORY=$($espeakData.FullName)" >> $env:GITHUB_ENV

      - name: Build application
        run: .\scripts\build.ps1 -Mode release
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Create resources zip
        run: |
          cd src-tauri/target/release
          7z a resources.zip resources
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-${{ matrix.target }}
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/resources.zip
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
